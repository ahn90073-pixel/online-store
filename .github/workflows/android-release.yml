name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag for the public release
        required: true
        default: v1.0.0
      release_name:
        description: Public GitHub Release title
        required: true
        default: Online Store v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build web app
        run: npm ci && npm run build && npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/*.apk release-assets/app-release.apk
          cp android/app/build/outputs/bundle/release/*.aab release-assets/app-release.aab
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/app-release.apk
            release-assets/app-release.aab
            release-assets/SHA256SUMS.txt
