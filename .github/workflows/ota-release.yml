name: Publish OTA Web Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ota:
    name: Build and publish OTA bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web bundle
        run: npm ci && npm run build

      - name: Package bundle and create manifest
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ota
          cd dist
          zip -qr ../ota/web-bundle.zip .
          cd ..
          HASH=$(sha256sum ota/web-bundle.zip | awk '{print $1}')
          # Keep OTA versions above the native 1.2.x baseline. The old 0.0.x
          # values were treated as older than the APK and skipped by the client.
          VERSION="1.2.${RUN_NUMBER}"
          BUNDLE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/ota-latest/web-bundle.zip"
          cat > ota/ota-manifest.json <<EOF
          {
            "appId": "com.ahn90073.onlinestore",
            "version": "${VERSION}",
            "channel": "production",
            "bundleUrl": "${BUNDLE_URL}",
            "sha256": "${HASH}",
            "commit": "${SHA}",
            "minimumNativeVersion": "1.1.0"
          }
          EOF
          printf '%s  %s\n' "$HASH" web-bundle.zip > ota/SHA256SUMS.txt
          cat ota/ota-manifest.json

      - name: Create or update OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view ota-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ota-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "OTA latest" \
              --notes "Automatically published web bundle for سوق اون لين" \
              --prerelease
          fi
          gh release upload ota-latest \
            ota/web-bundle.zip \
            ota/ota-manifest.json \
            ota/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Write OTA success summary
        if: success()
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("ota/ota-manifest.json"))["version"])')
          HASH=$(python3 -c 'import json; print(json.load(open("ota/ota-manifest.json"))["sha256"])')
          COMMIT=$(python3 -c 'import json; print(json.load(open("ota/ota-manifest.json"))["commit"])')
          {
            echo '# OTA deployment succeeded'
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Status | ✅ Published successfully |"
            echo "| OTA version | \`$VERSION\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| SHA-256 | \`$HASH\` |"
            echo "| Manifest | [Open manifest](https://github.com/$GITHUB_REPOSITORY/releases/download/ota-latest/ota-manifest.json) |"
            echo "| Bundle | [Download web-bundle.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/ota-latest/web-bundle.zip) |"
            echo "| Release | [Open ota-latest](https://github.com/$GITHUB_REPOSITORY/releases/tag/ota-latest) |"
            echo
            echo 'The bundle is available to native apps v1.1.0 or later.'
          } >> "$GITHUB_STEP_SUMMARY"
